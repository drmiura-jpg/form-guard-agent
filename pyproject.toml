[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "form-guard-agent"
version = "0.2.0"
description = "Fill only the designated fields of Word/Excel forms, prove nothing else changed, and keep a human in the loop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Masaki Miura" }]
dependencies = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "lxml>=5.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "anthropic>=2.0",
]

[project.optional-dependencies]
png = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "Pillow>=10.0"]

[project.scripts]
form-guard = "form_guard.cli:main"

[tool.setuptools]
packages = ["form_guard"]

[tool.setuptools.package-data]
form_guard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
